<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #EEF3F0;
    --paper: #FFFFFF;
    --ink: #1C2B28;
    --muted: #7C8C89;
    --teal: #1F7A6C;
    --teal-deep: #14524A;
    --amber: #E7A93C;
    --good: #2F9E5B;
    --bad: #E2574C;
    --line: #DDE6E1;
    --shadow: 0 10px 30px rgba(20,60,50,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(31,122,108,0.07), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(231,169,60,0.08), transparent 45%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    padding: 22px 18px 26px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Outfit',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--teal-deep);
  }
  .brand .jar{
    width:20px;height:20px;
    border-radius: 5px 5px 8px 8px;
    background: linear-gradient(180deg, transparent 45%, var(--amber) 45%);
    border: 2px solid var(--teal-deep);
  }
  .day-pill{
    font-size:12px;
    font-weight:600;
    color:var(--teal-deep);
    background:#DCEAE5;
    padding:5px 10px;
    border-radius:999px;
  }

  /* wordset bar */
  .sentence{
    font-size:14px;
    font-weight:500;
    color:var(--muted);
    line-height:1.5;
    padding: 0 6px;
    margin-top:6px;
  }
  .sentence strong{
    color: var(--teal-deep);
    font-weight:800;
  }

  .wordset-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--paper);
    border-radius:12px;
    padding:9px 10px 9px 12px;
    box-shadow: var(--shadow);
  }
  .wordset-info{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .wordset-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .wordset-btn{
    border:none;
    font-size:11.5px;
    font-weight:700;
    padding:7px 11px;
    border-radius:999px;
    cursor:pointer;
    background: var(--teal);
    color:#fff;
    white-space:nowrap;
  }
  .wordset-btn:active{ transform: scale(0.95); }
  .wordset-btn.ghost{
    background:#EAF3EF;
    color:var(--teal-deep);
  }

  .day-select-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border-radius:12px;
    padding:8px 12px;
    box-shadow: var(--shadow);
  }
  .day-select-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--teal-deep);
    flex-shrink:0;
  }
  .day-select{
    flex:1;
    border:none;
    background:#EAF3EF;
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    padding:7px 8px;
    border-radius:8px;
    -webkit-appearance:none;
    appearance:none;
  }

  /* mastery */
  .mastery-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 2px;
  }
  .mastery-label{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    white-space:nowrap;
  }
  .mastery-track{
    flex:1;
    height:5px;
    background:#DDE6E1;
    border-radius:999px;
    overflow:hidden;
  }
  .mastery-fill{
    height:100%;
    background: var(--amber);
    border-radius:999px;
    width:0%;
    transition: width .3s ease;
  }
  .review-toggle{
    flex-shrink:0;
    border:none;
    background:#EAF3EF;
    color:var(--teal-deep);
    font-size:11px;
    font-weight:700;
    padding:6px 10px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .review-toggle:active{ transform: scale(0.95); }

  .review-panel{
    background:var(--paper);
    border-radius:14px;
    padding:12px 14px;
    box-shadow: var(--shadow);
    max-height:260px;
    overflow-y:auto;
  }
  .review-round{ margin-bottom:12px; }
  .review-round:last-child{ margin-bottom:0; }
  .review-round-title{
    font-size:11.5px;
    font-weight:700;
    color:var(--teal-deep);
    margin-bottom:6px;
  }
  .review-word{
    padding:8px 10px;
    background:#F5F8F6;
    border-radius:8px;
    margin-bottom:6px;
  }
  .review-word:last-child{ margin-bottom:0; }
  .review-en{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .review-ko{
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    margin-left:8px;
  }
  .review-ex{
    font-size:11.5px;
    color:var(--muted);
    margin-top:3px;
    font-style:italic;
  }
  .review-empty{
    font-size:12px;
    color:var(--muted);
  }

  .complete-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background: #FFF6E6;
    border:1px solid #F1D89A;
    border-radius:12px;
    padding:10px 12px;
    font-size:12.5px;
    font-weight:600;
    color:#8A5A00;
  }
  .complete-banner-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }

  .example-line{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    font-style:italic;
    margin-top:-6px;
    padding:0 8px;
  }
  .example-line strong{
    color: var(--teal-deep);
    font-weight:800;
    font-style:normal;
  }
  .guess-btn{
    display:inline-flex;
    border:1px dashed #E0B84A;
    background:#FFF8E8;
    color:#8A5A00;
    font-size:11.5px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    margin-top:-4px;
  }
  .guess-btn:active{ transform: scale(0.95); }

  /* stats row */
  .stats{
    display:flex;
    gap:10px;
  }
  .stat{
    flex:1;
    background:var(--paper);
    border-radius:12px;
    padding:8px 10px;
    text-align:center;
    box-shadow: var(--shadow);
  }
  .stat .n{font-family:'Outfit',sans-serif;font-weight:700;font-size:17px;color:var(--teal-deep);}
  .stat .l{font-size:10.5px;color:var(--muted);margin-top:2px;}

  /* word card */
  .word-card{
    background: var(--paper);
    border-radius: 22px;
    padding: 36px 20px;
    text-align:center;
    box-shadow: var(--shadow);
    position:relative;
    min-height:118px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:6px;
  }
  .word-card .en{
    font-family:'Outfit',sans-serif;
    font-weight:800;
    font-size:32px;
    letter-spacing:-0.01em;
    color:var(--ink);
    word-break: break-word;
  }
  .word-card .phon{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing: 0.02em;
  }
  .speak-btn{
    position:absolute;
    top:14px; right:14px;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:#EAF3EF;
    color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .speak-btn:active{ transform: scale(0.92); }

  /* choices */
  .choices{
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper);
    border:2px solid transparent;
    border-radius:14px;
    padding:14px 16px;
    box-shadow: var(--shadow);
    cursor:pointer;
    font-size:15px;
    font-weight:500;
    text-align:left;
    transition: border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .choice:active{ transform: scale(0.985); }
  .choice .num{
    width:24px;height:24px;
    border-radius:8px;
    background:#DCEAE5;
    color:var(--teal-deep);
    font-size:12px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .choice.correct{
    border-color: var(--good);
    background: #E9F7EE;
  }
  .choice.correct .num{ background:var(--good); color:#fff; }
  .choice.wrong{
    border-color: var(--bad);
    background: #FDECEA;
  }
  .choice.wrong .num{ background:var(--bad); color:#fff; }
  .choice.disabled{ pointer-events:none; }
  .choice.dim{ opacity:0.55; }

  /* feedback line */
  .feedback{
    min-height: 20px;
    text-align:center;
    font-size:13px;
    font-weight:600;
  }
  .feedback.good{ color: var(--good); }
  .feedback.bad{ color: var(--bad); }

  /* bottom controls */
  .controls{
    margin-top:auto;
    padding-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
  }
  .ring-wrap{
    position:relative;
    width:56px;height:56px;
  }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke:#DDE6E1; stroke-width:5; }
  .ring-fg{ fill:none; stroke:var(--teal); stroke-width:5; stroke-linecap:round; transition: stroke-dashoffset .3s ease; }
  .ring-num{
    position:absolute; inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Outfit',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--teal-deep);
  }
  .ctrl-btn{
    width:52px;height:52px;
    border-radius:50%;
    border:none;
    background:var(--paper);
    box-shadow: var(--shadow);
    color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .ctrl-btn:active{ transform:scale(0.92); }
  .ctrl-btn.skip{ color: var(--muted); }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="jar"></span>단어 항아리</div>
    <div class="day-pill" id="datePill">오늘</div>
  </div>

  <div class="wordset-bar">
    <div class="wordset-info" id="wordsetInfo">기본 단어은행</div>
    <div class="wordset-actions">
      <button class="wordset-btn ghost" id="resetBankBtn" style="display:none;">기본으로</button>
      <button class="wordset-btn" id="loadExcelBtn">엑셀 불러오기</button>
    </div>
    <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" hidden>
  </div>

  <div class="day-select-wrap" id="daySelectWrap" style="display:none;">
    <span class="day-select-label">Day</span>
    <select class="day-select" id="daySelect"></select>
  </div>

  <div class="mastery-bar" id="masteryBar">
    <div class="mastery-label" id="masteryLabel">1회차 진행 0 / 0</div>
    <div class="mastery-track"><div class="mastery-fill" id="masteryFill"></div></div>
    <button class="review-toggle" id="reviewToggleBtn">오답노트</button>
  </div>
  <div class="review-panel" id="reviewPanel" style="display:none;"></div>
  <div class="complete-banner" id="completeBanner" style="display:none;">
    <span id="completeBannerText">🎉 회차 완료!</span>
    <div class="complete-banner-actions">
      <button class="wordset-btn" id="completeLoadBtn">새 단어장</button>
      <button class="wordset-btn ghost" id="completeCloseBtn">닫기</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="statCorrect">0</div><div class="l">정답</div></div>
    <div class="stat"><div class="n" id="statWrong">0</div><div class="l">오답</div></div>
    <div class="stat"><div class="n" id="statStreak">0</div><div class="l">연속 정답</div></div>
  </div>

  <div id="quizArea"></div>

  <div class="feedback" id="feedback"></div>
  <div class="example-line" id="exampleLine" style="display:none;"></div>
  <div style="text-align:center;">
    <button class="guess-btn" id="guessBtn" style="display:none;">🎯 사실 찍었어요</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="speakBtnBottom" title="다시 듣기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <div class="ring-wrap">
      <svg width="56" height="56">
        <circle class="ring-bg" cx="28" cy="28" r="24"></circle>
        <circle class="ring-fg" id="ringFg" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="150.8"></circle>
      </svg>
      <div class="ring-num" id="ringNum">500</div>

/* 중복/오타 제거 + 예문 자리(빈 문자열) 추가 */
const seen = new Set();
const DEFAULT_BANK = WORDS.filter(([en]) => {
  const k = en.toLowerCase();
  if (seen.has(k)) return false;
  seen.add(k);
  return true;
}).map(([en,ko]) => [en, ko, '']);

const STORAGE_KEY = "vocab-jar-progress";
const CUSTOM_BANK_KEY = "vocab-jar-custom-bank";

/* ---------------- 사용자 엑셀 단어장 ---------------- */
function loadCustomBank(){
  try{
    const raw = JSON.parse(localStorage.getItem(CUSTOM_BANK_KEY));
    if(raw && Array.isArray(raw.words) && raw.words.length >= 4) return raw;
  }catch(e){}
  return null;
}

function dedupePairs(items){
  const s = new Set();
  return items.filter(([en]) => {
    const k = String(en).trim().toLowerCase();
    if(!k || s.has(k)) return false;
    s.add(k);
    return true;
  });
}

function parseWorkbookAllSheets(workbook){
  const allItems = [];
  const days = [];
  workbook.SheetNames.forEach(sheetName => {
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    let data = rows.filter(r => r && r.length >= 2 && String(r[0]).trim() && String(r[1]).trim());
    if(data.length && /^(word|단어|영단어|english|영어)$/i.test(String(data[0][0]).trim())){
      data = data.slice(1);
    }
    if(!data.length) return;
    days.push(sheetName);
    data.forEach(r => {
      allItems.push([
        String(r[0]).trim(),
        String(r[1]).trim(),
        r[2] !== undefined ? String(r[2]).trim() : '',
        sheetName
      ]);
    });
  });
  return { items: dedupePairs(allItems), days };
}

const SELECTED_DAY_KEY = "vocab-jar-selected-day";
const ALL_DAYS = "__all__";

function getSelectedDay(){
  const custom = loadCustomBank();
  if(!custom || !custom.days || custom.days.length <= 1) return ALL_DAYS;
  try{
    const raw = JSON.parse(localStorage.getItem(SELECTED_DAY_KEY));
    if(raw && raw.bankName === custom.name){
      if(raw.day === ALL_DAYS || custom.days.includes(raw.day)) return raw.day;
    }
  }catch(e){}
  return ALL_DAYS;
}

function setSelectedDay(day){
  const custom = loadCustomBank();
  if(!custom) return;
  localStorage.setItem(SELECTED_DAY_KEY, JSON.stringify({ bankName: custom.name, day }));
}

function computeActiveBank(){
  const custom = loadCustomBank();
  if(!custom) return DEFAULT_BANK;
  const day = getSelectedDay();
  if(day === ALL_DAYS) return custom.words;
  const filtered = custom.words.filter(w => w[3] === day);
  return filtered.length >= 4 ? filtered : custom.words;
}

let activeBank = computeActiveBank();

function updateWordsetInfo(){
  const custom = loadCustomBank();
  const info = document.getElementById('wordsetInfo');
  const resetBtn = document.getElementById('resetBankBtn');
  const daySelectWrap = document.getElementById('daySelectWrap');
  const daySelect = document.getElementById('daySelect');

  if(custom){
    const day = getSelectedDay();
    const dayLabel = (day === ALL_DAYS) ? '전체' : day;
    info.textContent = `${custom.name} · ${dayLabel} · ${activeBank.length}개`;
    resetBtn.style.display = 'inline-flex';

    if(custom.days && custom.days.length > 1){
      daySelectWrap.style.display = 'flex';
      daySelect.innerHTML = `<option value="${ALL_DAYS}">전체 (${custom.words.length}개)</option>` +
        custom.days.map(d => {
          const cnt = custom.words.filter(w => w[3] === d).length;
          return `<option value="${escapeHtml(d)}">${escapeHtml(d)} (${cnt}개)</option>`;
        }).join('');
      daySelect.value = day;
    }else{
      daySelectWrap.style.display = 'none';
    }
  }else{
    info.textContent = `기본 단어은행 · ${DEFAULT_BANK.length}개`;
    resetBtn.style.display = 'none';
    daySelectWrap.style.display = 'none';
  }
}

/* ---------------- 회차(round)별 학습 진행 + 오답/스킵 기록 ---------------- */
const ROUND_KEY = "vocab-jar-rounds";

function currentBankKey(){
  const custom = loadCustomBank();
  if(!custom) return `default:${DEFAULT_BANK.length}`;
  return `custom:${custom.name}:${custom.words.length}:day=${getSelectedDay()}`;
}

function loadRoundState(){
  try{
    const raw = JSON.parse(localStorage.getItem(ROUND_KEY));
    if(raw && raw.bankKey === currentBankKey()){
      return raw;
    }
  }catch(e){}
  return { bankKey: currentBankKey(), roundNumber: 1, seen: [], missed: [], history: [] };
}

let roundState = loadRoundState();

function saveRoundState(){
  localStorage.setItem(ROUND_KEY, JSON.stringify(roundState));
}

function registerResult(en, correct){
  const key = String(en).trim().toLowerCase();
  if(!roundState.seen.includes(key)) roundState.seen.push(key);
  if(!correct && !roundState.missed.includes(key)) roundState.missed.push(key);
  saveRoundState();
  maybeFinalizeRound();
}

function maybeFinalizeRound(){
  if(activeBank.length > 0 && roundState.seen.length >= activeBank.length){
    const finishedRound = roundState.roundNumber;
    const missedCount = roundState.missed.length;
    roundState.history.push({ round: finishedRound, total: activeBank.length, missed: [...roundState.missed] });
    roundState.roundNumber += 1;
    roundState.seen = [];
    roundState.missed = [];
    saveRoundState();
    showRoundCompleteBanner(finishedRound, missedCount);
  }
  updateMasteryUI();
}

function showRoundCompleteBanner(finishedRound, missedCount){
  const banner = document.getElementById('completeBanner');
  const text = document.getElementById('completeBannerText');
  text.textContent = `🎉 ${finishedRound}회차 완료! 틀리거나 넘어간 단어 ${missedCount}개는 오답노트에 쌓였어요. ${finishedRound+1}회차가 이어서 시작돼요.`;
  banner.style.display = 'flex';
}

function updateMasteryUI(){
  const label = document.getElementById('masteryLabel');
  const fill = document.getElementById('masteryFill');
  const pct = activeBank.length ? Math.min(100, (roundState.seen.length/activeBank.length)*100) : 0;
  fill.style.width = pct + '%';
  label.textContent = `${roundState.roundNumber}회차 진행 ${roundState.seen.length} / ${activeBank.length}`;
}

function bankLookup(){
  const map = {};
  activeBank.forEach(item=>{
    const en = item[0], ko = item[1], example = item[2] || '';
    map[String(en).trim().toLowerCase()] = { en, ko, example };
  });
  return map;
}

function renderReviewPanel(){
  const map = bankLookup();
  const panel = document.getElementById('reviewPanel');
  const rounds = [...roundState.history, { round: roundState.roundNumber, missed: roundState.missed, inProgress: true }];
  const html = rounds.slice().reverse().map(r=>{
    const label = r.inProgress
      ? `${r.round}회차 (진행중) · 오답/스킵 ${r.missed.length}개`
      : `${r.round}회차 · 오답/스킵 ${r.missed.length}개`;
    const words = r.missed.map(key=>{
      const w = map[key];
      if(!w) return '';
      return `<div class="review-word">
        <div class="review-en">${w.en}<span class="review-ko">${w.ko}</span></div>
        ${w.example ? `<div class="review-ex">${w.example}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="review-round">
      <div class="review-round-title">${label}</div>
      ${words || '<div class="review-empty">아직 없어요</div>'}
    </div>`;
  }).join('');
  panel.innerHTML = html || '<div class="review-empty">아직 기록이 없어요</div>';
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function loadState(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ raw = null; }
  if(!raw || raw.date !== todayStr()){
    raw = { date: todayStr(), done: 0, correct: 0, wrong: 0, streak: 0, bestStreak: 0 };
  }
  return raw;
}
function saveState(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

let state = loadState();
let current = null; // {word, choices, correctIndex}
let locked = false;

const el = {
  statCorrect: document.getElementById('statCorrect'),
  statWrong: document.getElementById('statWrong'),
  statStreak: document.getElementById('statStreak'),
  quizArea: document.getElementById('quizArea'),
  feedback: document.getElementById('feedback'),
  ringFg: document.getElementById('ringFg'),
  ringNum: document.getElementById('ringNum'),
  datePill: document.getElementById('datePill'),
  speakBtnBottom: document.getElementById('speakBtnBottom'),
  skipBtn: document.getElementById('skipBtn'),
};

const RING_CIRC = 150.8;

function updateHeader(){
  el.statCorrect.textContent = state.correct;
  el.statWrong.textContent = state.wrong;
  el.statStreak.textContent = state.streak;
  // 링: 이번 회차에서 아직 안 본 단어 수
  const total = activeBank.length;
  const remaining = Math.max(0, total - roundState.seen.length);
  el.ringNum.textContent = remaining;
  const frac = total ? (remaining/total) : 0;
  el.ringFg.style.strokeDasharray = RING_CIRC;
  el.ringFg.style.strokeDashoffset = RING_CIRC * (1-frac);
  const now = new Date();
  el.datePill.textContent = `${now.getMonth()+1}월 ${now.getDate()}일`;
}

function pickRandom(arr, n, excludeIdx){
  const idxs = arr.map((_,i)=>i).filter(i=>i!==excludeIdx);
  for(let i=idxs.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]] = [idxs[j],idxs[i]];
  }
  return idxs.slice(0,n);
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function formatExample(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

function pickWordIndex(){
  const seenSet = new Set(roundState.seen);
  const unseen = [];
  for(let i=0;i<activeBank.length;i++){
    if(!seenSet.has(String(activeBank[i][0]).trim().toLowerCase())) unseen.push(i);
  }
  const pool = unseen.length ? unseen : activeBank.map((_,i)=>i);
  return pool[Math.floor(Math.random()*pool.length)];
}

function nextQuestion(){
  locked = false;
  el.feedback.textContent = '';
  el.feedback.className = 'feedback';
  const exLine = document.getElementById('exampleLine');
  if(exLine){ exLine.style.display = 'none'; exLine.textContent = ''; }
  const guessBtn = document.getElementById('guessBtn');
  if(guessBtn){ guessBtn.style.display = 'none'; guessBtn.onclick = null; }

  const wordIdx = pickWordIndex();
  const [en, ko, example] = activeBank[wordIdx];

  const wrongIdxs = pickRandom(activeBank, 3, wordIdx);
  const options = [ko, ...wrongIdxs.map(i=>activeBank[i][1])];
  // shuffle options with correct index tracking
  const order = [0,1,2,3];
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  const shuffled = order.map(i=>options[i]);
  const correctPos = order.indexOf(0);

  current = { en, ko, example: example || '', choices: shuffled, correctIndex: correctPos };
  renderQuiz();
  speak(en);
}

function renderQuiz(){
  const cardInner = `
    <button class="speak-btn" id="speakBtnTop" title="발음 듣기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <div class="en">${current.en}</div>
    ${ current.example ? `<div class="sentence">${formatExample(current.example)}</div>` : `<div class="phon">탭하여 발음 다시 듣기</div>` }
  `;

  el.quizArea.innerHTML = `
    <div class="word-card">${cardInner}</div>
    <div class="choices" style="margin-top:14px;">
      ${current.choices.map((ko,i)=>`
        <div class="choice" data-idx="${i}">
          <span class="num">${i+1}</span>
          <span>${ko}</span>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('speakBtnTop').addEventListener('click', ()=>speak(current.en));
  el.quizArea.querySelectorAll('.choice').forEach(node=>{
    node.addEventListener('click', ()=>selectAnswer(parseInt(node.dataset.idx)));
  });
}

function selectAnswer(idx){
  if(locked) return;
  locked = true;
  const nodes = el.quizArea.querySelectorAll('.choice');
  const isCorrect = idx === current.correctIndex;

  nodes.forEach((node,i)=>{
    node.classList.add('disabled');
    if(i === current.correctIndex) node.classList.add('correct');
    else if(i === idx) node.classList.add('wrong');
    else node.classList.add('dim');
  });

  const guessBtn = document.getElementById('guessBtn');
  if(isCorrect){
    state.correct += 1;
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    el.feedback.textContent = '정답이에요 👍';
    el.feedback.className = 'feedback good';
    guessBtn.style.display = 'inline-flex';
  }else{
    state.wrong += 1;
    state.streak = 0;
    el.feedback.textContent = `오답 · 정답은 "${current.choices[current.correctIndex]}"`;
    el.feedback.className = 'feedback bad';
    guessBtn.style.display = 'none';
  }
  saveState(state);
  updateHeader();

  const guessedWord = current.en;
  let finalized = false;
  const finalize = (countedCorrect) => {
    if(finalized) return;
    finalized = true;
    registerResult(guessedWord, countedCorrect);
  };

  const advanceDelay = isCorrect ? 2200 : 1300;
  const timer = setTimeout(()=>{ finalize(isCorrect); nextQuestion(); }, advanceDelay);

  guessBtn.onclick = () => {
    clearTimeout(timer);
    finalize(false);
    guessBtn.style.display = 'none';
    el.feedback.textContent = '오답노트에 표시했어요 · 다음 회차에 다시 나와요';
    el.feedback.className = 'feedback bad';
    setTimeout(()=>{ nextQuestion(); }, 700);
  };
}

el.speakBtnBottom.addEventListener('click', ()=>{
  if(current) speak(current.en);
});
el.skipBtn.addEventListener('click', ()=>{
  if(locked || !current) return;
  locked = true;
  const nodes = el.quizArea.querySelectorAll('.choice');
  nodes.forEach(node=>node.classList.add('disabled'));
  el.feedback.textContent = `모르는 단어로 표시했어요 · 정답은 "${current.choices[current.correctIndex]}"`;
  el.feedback.className = 'feedback bad';
  document.getElementById('guessBtn').style.display = 'none';
  registerResult(current.en, false);
  setTimeout(()=>{ nextQuestion(); }, 900);
});

const loadExcelBtn = document.getElementById('loadExcelBtn');
const excelInput = document.getElementById('excelInput');
const resetBankBtn = document.getElementById('resetBankBtn');
const completeLoadBtn = document.getElementById('completeLoadBtn');
const completeCloseBtn = document.getElementById('completeCloseBtn');
const reviewToggleBtn = document.getElementById('reviewToggleBtn');
const daySelect = document.getElementById('daySelect');

loadExcelBtn.addEventListener('click', () => excelInput.click());
completeLoadBtn.addEventListener('click', () => excelInput.click());
completeCloseBtn.addEventListener('click', () => {
  document.getElementById('completeBanner').style.display = 'none';
});

reviewToggleBtn.addEventListener('click', () => {
  const panel = document.getElementById('reviewPanel');
  const visible = panel.style.display !== 'none';
  if(visible){
    panel.style.display = 'none';
  }else{
    renderReviewPanel();
    panel.style.display = 'block';
  }
});

function switchToBank(customBank){
  localStorage.setItem(CUSTOM_BANK_KEY, JSON.stringify(customBank));
  setSelectedDay(ALL_DAYS);
  activeBank = computeActiveBank();
  roundState = loadRoundState();
  updateWordsetInfo();
  updateMasteryUI();
  document.getElementById('completeBanner').style.display = 'none';
  document.getElementById('reviewPanel').style.display = 'none';
  locked = false;
  nextQuestion();
}

excelInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const { items, days } = parseWorkbookAllSheets(workbook);
      if(items.length < 4){
        alert('단어가 4개 이상 필요해요. 엑셀 A열=영단어, B열=뜻, C열=예문(선택)으로 넣어주세요.');
        return;
      }
      const customBank = {
        name: file.name.replace(/\.[^/.]+$/, ''),
        words: items,
        days: days.length > 1 ? days : []
      };
      switchToBank(customBank);
    }catch(err){
      alert('파일을 읽는 중 문제가 생겼어요. xlsx, xls, csv 파일인지 확인해주세요.');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

daySelect.addEventListener('change', () => {
  setSelectedDay(daySelect.value);
  activeBank = computeActiveBank();
  roundState = loadRoundState();
  updateWordsetInfo();
  updateMasteryUI();
  document.getElementById('completeBanner').style.display = 'none';
  document.getElementById('reviewPanel').style.display = 'none';
  locked = false;
  nextQuestion();
});

resetBankBtn.addEventListener('click', () => {
  localStorage.removeItem(CUSTOM_BANK_KEY);
  localStorage.removeItem(SELECTED_DAY_KEY);
  activeBank = DEFAULT_BANK;
  roundState = loadRoundState();
  updateWordsetInfo();
  updateMasteryUI();
  document.getElementById('completeBanner').style.display = 'none';
  document.getElementById('reviewPanel').style.display = 'none';
  locked = false;
  nextQuestion();
});

updateWordsetInfo();
updateMasteryUI();
updateHeader();
nextQuestion();
</script>
